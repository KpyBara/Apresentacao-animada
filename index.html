<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Apresentação Animada</title>
</head>
<body>
    <main>
        <div class="item active" style="--background: #EA3D41">
            <div class="title">Morango</div>
            <img src="./img/Morangos.png" alt="Morango" class="fruit">
            <img src="./img/Morango-refrigerante.png" alt="Refrigerante de Morango" class="drink">
        </div>
        <div class="item" style="--background: #E7A043">
            <div class="title">Laranja</div>
            <img src="./img/Laranjas.png" alt="Laranja" class="fruit">
            <img src="./img/Laranja-refrigerante.png" alt="Refrigerante de Laranja" class="drink">
        </div>
        <div class="item hidden" style="--background: #2D5643">
            <div class="title">Abacate</div>
            <img src="./img/Abacates.png" alt="Abacate" class="fruit">
            <img src="./img/Abacate-refrigerante.png" alt="Refrigerante de Abacate" class="drink">
        </div>

        <div class="arrow">
            <button id="prev"> < </button>
            <button id="next"> > </button>
        </div>
    </main>
</body>
</html>
